<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Growth & Development — Practice Quiz</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --border:#2a2f3a;
    --text:#eef1f6;
    --muted:#9aa3b2;
    --accent:#4f8cff;
    --correct:#2fbf71;
    --correct-bg:#123524;
    --wrong:#ef5350;
    --wrong-bg:#3a1a1a;
    --tag:#3a2f6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:20px 14px 60px;
  }
  h1{
    font-size:20px;
    text-align:center;
    margin:0 0 4px;
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-bottom:22px;
  }
  .quiz-container{
    max-width:640px;
    margin:0 auto;
  }
  .qcard{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 16px;
    margin-bottom:18px;
  }
  .qmeta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .qnum{
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:0.03em;
  }
  .qtag{
    font-size:11px;
    background:var(--tag);
    color:#c9c3ff;
    padding:3px 9px;
    border-radius:20px;
  }
  .qtext{
    font-size:15.5px;
    line-height:1.5;
    margin-bottom:14px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .option{
    text-align:left;
    background:#1e222c;
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 13px;
    border-radius:10px;
    font-size:14.5px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    line-height:1.4;
  }
  .option:hover:not(.locked){
    border-color:var(--accent);
  }
  .option.correct-pick{
    background:var(--correct-bg);
    border-color:var(--correct);
    color:#c9f5da;
  }
  .option.wrong-pick{
    background:var(--wrong-bg);
    border-color:var(--wrong);
    color:#ffd6d4;
  }
  .option.reveal-correct{
    border-color:var(--correct);
    box-shadow:inset 0 0 0 1px var(--correct);
  }
  .option.dim{
    opacity:0.55;
  }
  .feedback{
    margin-top:12px;
    padding:12px 13px;
    border-radius:10px;
    font-size:14px;
    line-height:1.55;
    display:none;
  }
  .feedback.show{
    display:block;
    animation:fadeIn .25s ease;
  }
  .feedback.right{
    background:var(--correct-bg);
    border:1px solid var(--correct);
    color:#d7f7e3;
  }
  .feedback.wrong{
    background:var(--wrong-bg);
    border:1px solid var(--wrong);
    color:#ffe1df;
  }
  .feedback .status{
    font-weight:700;
    margin-bottom:4px;
    display:block;
  }
  .feedback .explain{
    color:var(--muted);
    margin-top:6px;
  }
  .feedback .explain b{
    color:var(--text);
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(-4px);}
    to{opacity:1; transform:translateY(0);}
  }
  .score-bar{
    max-width:640px;
    margin:0 auto 20px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    position:sticky;
    top:10px;
    z-index:5;
  }
  .score-bar span{color:var(--muted);}
  .score-bar b{color:var(--accent); font-size:16px;}
  .reset-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    font-size:12px;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .reset-btn:hover{
    color:var(--text);
    border-color:var(--accent);
  }
</style>
</head>
<body>

<h1>🌱 Plant Growth & Development</h1>
<div class="subtitle">Practice PYQs — Development, Plasticity, PGR Classification, Table & Discovery</div>

<div class="score-bar">
  <span>Score: <b id="scoreDisplay">0</b> / <span id="totalDisplay">0</span></span>
  <button class="reset-btn" onclick="resetQuiz()">Reset</button>
</div>

<div class="quiz-container" id="quizContainer"></div>

<script>
const questions = [
  {
    tag: "Development",
    text: "चित्र में विभज्योतकी कोशिका (Meristematic cell) से मैच्योर कोशिका बनने तक के 1, 2, 3, 4 चरणों को उनके सही sequence में पहचानो।",
    options: [
      "1 = Elongation, 2 = Differentiation, 3 = Cell maturation, 4 = Cell division",
      "1 = Cell division, 2 = Differentiation, 3 = Elongation, 4 = Maturation",
      "1 = Differentiation, 2 = Cell division, 3 = Maturation, 4 = Elongation",
      "1 = Maturation, 2 = Elongation, 3 = Cell division, 4 = Differentiation"
    ],
    correct: 1,
    explain: "Sahi sequence hai: <b>Cell division → Differentiation → Elongation → Maturation</b>. Meristematic cell pehle divide hoti hai, phir differentiate hoti hai apna function decide karne ke liye, phir elongate hoti hai size badhane ke liye, aur akhir me mature ho jaati hai."
  },
  {
    tag: "Plasticity",
    text: "निम्नलिखित में से कौन सा पौधा Plasticity नहीं दिखाता है? (NEET 2022)",
    options: ["Maize", "Cotton", "Coriander", "Buttercup"],
    correct: 0,
    explain: "<b>Maize</b> heterophylly ya kisi tarah ki plasticity nahi dikhata — iski leaves har stage/environment me ek jaisi rehti hain. Cotton, Coriander (age-based) aur Buttercup (environment-based) sab plasticity ka example hain."
  },
  {
    tag: "Plasticity",
    text: "एक चित्र में Juvenile, Adult, Terrestrial aur Aquatic leaves दिखाई गई हैं। ये चित्र किस phenomenon को represent karta hai?",
    options: ["Heterophylly", "Growth", "Plasticity", "एक से ज़्यादा सही हैं"],
    correct: 3,
    explain: "Heterophylly khud Plasticity ka hi ek example hai — isliye jab dono options diye jaate hain (Heterophylly aur Plasticity), tab <b>'more than one correct'</b> hi sahi answer hota hai. Plasticity bada concept hai, Heterophylly uska proof hai."
  },
  {
    tag: "PGR Classification",
    text: "Kinetin रासायनिक रूप से क्या है?",
    options: ["Indole-3-acetic acid", "Terpene", "N⁶-furfuryl amino purine", "Carotenoid"],
    correct: 2,
    explain: "Kinetin ek <b>Adenine derivative</b> hai, aur iska chemical naam hai <b>N⁶-furfuryl amino purine</b>. Ye Adenine ko modify karke banaya gaya first cytokinin tha, isliye natural cytokinin nahi hai."
  },
  {
    tag: "PGR Classification",
    text: "निम्नलिखित में से कौन सा गलत match है?",
    options: [
      "PGRs — Small and simple molecules",
      "Auxin — Oat seedlings",
      "Cytokinins — Plant growth promoters",
      "GA₃ — Adenine derivatives"
    ],
    correct: 3,
    explain: "GA₃ (Gibberellic acid) asal me <b>Terpene</b> hai, Adenine derivative nahi. Adenine derivative sirf Cytokinin (Kinetin) hota hai — ye common confusion point hai."
  },
  {
    tag: "PGR Table",
    text: "IAA (Indole Acetic Acid) का primary precursor है:",
    options: ["Phenylalanine", "Tyrosine", "Tryptophan", "Valine"],
    correct: 2,
    explain: "IAA ka precursor hai <b>Tryptophan</b>, jo ek amino acid hai. Zn²⁺ ki action se deamination hone par Tryptophan se IAA banta hai."
  },
  {
    tag: "Discovery History",
    text: "Auxin को coleoptile के tips से किसने और कहाँ से isolate किया था?",
    options: [
      "Canary grass से, Charles और Francis Darwin द्वारा",
      "Canary grass से, F.W. Went द्वारा",
      "Oat seedlings से, Charles और Francis Darwin द्वारा",
      "Oat seedlings से, F.W. Went द्वारा"
    ],
    correct: 3,
    explain: "Darwin father-son ne sirf <b>canary grass</b> me phototropism observe kiya tha (ki tip hi signal bhejta hai). Actual Auxin isolation baad me <b>F.W. Went</b> ne <b>oat seedlings</b> ke coleoptile tips se kiya."
  },
  {
    tag: "Discovery History",
    text: "1960 के दशक में तीन independent scientists ने तीन अलग-अलग inhibitors रिपोर्ट किए (Inhibitor-B, Abscission II, Dormin), जो बाद में chemically identical निकले। इसे नाम दिया गया:",
    options: ["Indole acetic acid", "Indole butyric acid", "Naphthalene acetic acid", "Abscisic acid"],
    correct: 3,
    explain: "Teeno substances (Inhibitor-B, Abscission II, Dormin) chemically identical nikle, aur unhe common naam diya gaya <b>Abscisic Acid (ABA)</b>."
  }
];

let score = 0;
let answered = new Array(questions.length).fill(false);

function renderQuiz(){
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  document.getElementById('totalDisplay').textContent = questions.length;

  questions.forEach((q, qIndex) => {
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = `
      <div class="qmeta">
        <span class="qnum">Q${qIndex + 1}</span>
        <span class="qtag">${q.tag}</span>
      </div>
      <div class="qtext">${q.text}</div>
      <div class="options" id="options-${qIndex}"></div>
      <div class="feedback" id="feedback-${qIndex}"></div>
    `;
    container.appendChild(card);

    const optionsDiv = card.querySelector(`#options-${qIndex}`);
    q.options.forEach((optText, optIndex) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = optText;
      btn.onclick = () => selectAnswer(qIndex, optIndex);
      optionsDiv.appendChild(btn);
    });
  });
}

function selectAnswer(qIndex, optIndex){
  if(answered[qIndex]) return;
  answered[qIndex] = true;

  const q = questions[qIndex];
  const optionsDiv = document.getElementById(`options-${qIndex}`);
  const buttons = optionsDiv.querySelectorAll('.option');
  const feedback = document.getElementById(`feedback-${qIndex}`);

  buttons.forEach((btn, i) => {
    btn.classList.add('locked');
    btn.onclick = null;
    if(i === optIndex && i === q.correct){
      btn.classList.add('correct-pick');
    } else if(i === optIndex && i !== q.correct){
      btn.classList.add('wrong-pick');
    } else if(i === q.correct){
      btn.classList.add('reveal-correct');
    } else {
      btn.classList.add('dim');
    }
  });

  const isCorrect = optIndex === q.correct;
  if(isCorrect) score++;

  feedback.className = 'feedback show ' + (isCorrect ? 'right' : 'wrong');
  feedback.innerHTML = `
    <span class="status">${isCorrect ? '✅ सही जवाब!' : '❌ गलत जवाब'}</span>
    <div class="explain">${q.explain}</div>
  `;

  document.getElementById('scoreDisplay').textContent = score;
}

function resetQuiz(){
  score = 0;
  answered = new Array(questions.length).fill(false);
  document.getElementById('scoreDisplay').textContent = 0;
  renderQuiz();
}

renderQuiz();
</script>

</body>
</html>
